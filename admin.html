const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), x => "abcdefghijklmnopqrstuvwxyz0123456789"[x % 36]).join("");
let mt; const msg = (t, err) => { const m = $("msg"); m.textContent = t; m.className = "on" + (err ? " err" : ""); clearTimeout(mt); mt = setTimeout(() => m.className = "", 2600); };
const timeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error("timeout")), ms))]);
const isDenied = e => /permission.?denied/i.test(String(e && (e.code || e.message)));

/* ---------- อ่าน / เขียนบอร์ด (วิธีเดียวกับหลังบ้านหลัก: ส่งเฉพาะโพสต์ที่เปลี่ยน + รหัสยืนยัน) ---------- */
let PHOTO = "";
async function load() {
  const snap = await timeout(get(ref(db, "boards/" + BID)), 30000);
  const raw = snap.val() || {}, rp = raw.posts || {}; PHOTO = (raw.img && raw.img.photo) || "";
  posts = (Array.isArray(rp) ? rp : Object.values(rp)).filter(p => p && p.id);
}
function apply(list, b) {
  if (b.op === "addMany") b.posts.forEach(x => { if (!list.some(y => y.id === x.id)) list.push(x); });
  else if (b.op === "add") { if (!list.some(x => x.id === b.post.id)) list.push(b.post); }
  else if (b.op === "patch") { const p = list.find(x => x.id === b.id); if (!p) throw new Error("not_found"); Object.assign(p, b.fields); }
  else if (b.op === "delete") return list.filter(x => x.id !== b.id);
  return list;
}
async function commit(body) {
  const path = "boards/" + BID, clean = x => JSON.parse(JSON.stringify(x));
  for (let i = 0; i < 3; i++) {
    const snap = await timeout(get(ref(db, path)), 30000);
    if (!snap.exists()) throw new Error("not_found");
    const raw = snap.val() || {}, rp = raw.posts || {};
    const entries = (Array.isArray(rp) ? rp.map((p, k) => [String(k), p]) : Object.entries(rp)).filter(([, p]) => p != null);
    const keyById = new Map(entries.filter(([, p]) => p && p.id).map(([k, p]) => [String(p.id), k]));
    const before = new Map(entries.filter(([, p]) => p && p.id).map(([, p]) => [String(p.id), clean(p)]));
    let nextKey = entries.reduce((m, [k]) => /^\d+$/.test(k) ? Math.max(m, Number(k) + 1) : m, 0);
    const after = apply(entries.map(([, p]) => clean(p)), body);
    const afterById = new Map(after.filter(p => p && p.id).map(p => [String(p.id), p]));
    const n = rid(10), up = {};
    keyById.forEach((k, id) => { if (!afterById.has(id)) { up[path + "/posts/" + k] = null; up[path + "/del/" + id.replace(/[.#$\[\]\/]/g, "_")] = { id, t: serverTimestamp() }; } });
    after.forEach(q => {
      const id = String(q.id), k = keyById.get(id), o = before.get(id);
      if (k == null) { const nq = clean(q); nq.u = serverTimestamp(); up[path + "/posts/" + (nextKey++)] = nq; return; }
      let ch = false;
      new Set(Object.keys(q).concat(Object.keys(o || {}))).forEach(f => { if (f === "u") return; if (JSON.stringify(q[f]) !== JSON.stringify((o || {})[f])) { ch = true; up[path + "/posts/" + k + "/" + f] = q[f] === undefined ? null : q[f]; } });
      if (ch) up[path + "/posts/" + k + "/u"] = serverTimestamp();
    });
    if (body.img !== undefined) up[path + "/img/photo"] = body.img || null;   // รูปหน้าแรก เก็บแยกจากโพสต์
    up[path + "/n"] = n; up[path + "/p"] = raw.n || "-";
    up["tx/" + BID + "/" + n] = PIN;
    try { await timeout(update(ref(db), up), 60000); posts = after; if (body.img !== undefined) PHOTO = body.img || ""; return true; }
    catch (e) { if (!isDenied(e)) throw e; }
  }
  throw new Error("denied");
}
async function write(body, ok) {
  msg("กำลังบันทึก…");
  try { await commit(body); render(); msg(ok); return true; }
  catch (e) {
    if (e.message === "denied") { msg("รหัสแอดมินไม่ถูกต้อง", true); lock(); return false; }
    msg("บันทึกไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วลองใหม่", true); return false;
  }
}

const DEF = {

  yt: [{ cat: "song", t: "Melt (โต๊ะริม) · นนท์ ธนนท์", s: "MV ที่น้ำปิงเป็นพระเอก", q: "Melt โต๊ะริม Nont Tanont" },
       { cat: "clip", t: "เขมจิราต้องรอด", s: "ตัวอย่างและคลิปจากซีรีส์", q: "เขมจิราต้องรอด Khemjira" }],

const BIO = [["th", "ชื่อไทย"], ["en", "ชื่ออังกฤษ"], ["tag", "ป้ายใต้ชื่อ"], ["bio", "ประวัติ (เว้นบรรทัดว่าง = ขึ้นย่อหน้าใหม่)", "area"], ["birth", "วันเกิด"], ["home", "บ้านเกิด"], ["height", "ส่วนสูง"], ["agency", "สังกัด"], ["ig", "Instagram (ไม่ต้องใส่ @)"], ["x", "X (ไม่ต้องใส่ @)"], ["tt", "TikTok (ไม่ต้องใส่ @)"]];

// ย่อรูปให้กว้างไม่เกิน 600px แล้วแปลงเป็น JPEG (ไฟล์เล็ก โหลดเร็ว)
function shrink(file) {
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const W = 600, sc = Math.min(1, W / im.naturalWidth), c = document.createElement("canvas");
      c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      let q = .82, d = c.toDataURL("image/jpeg", q);
      while (d.length > 140000 && q > .4) { q -= .1; d = c.toDataURL("image/jpeg", q); }
      ok(d);
    };
    im.onerror = () => { URL.revokeObjectURL(u); no(new Error("bad")); };
    im.src = u;
  });
}
const ytId = s => { s = String(s || "").trim(); const m = s.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/); return m ? m[1] : /^[\w-]{11}$/.test(s) ? s : ""; };

      inp[k] = i;
    });
    const sv = el("button", "pri", "＋ " + S.add), cancel = el("button", null, "ยกเลิกแก้ไข"); sv.type = cancel.type = "button"; cancel.hidden = true;
    const r = el("div", "row"); r.append(sv, cancel); c.appendChild(r);
    const reset = () => { editId = null; Object.values(inp).forEach(i => { if (i.type === "checkbox") i.checked = false; else if (i.tagName === "SELECT") i.selectedIndex = 0; else i.value = ""; }); sv.textContent = "＋ " + S.add; cancel.hidden = true; };
    cancel.onclick = reset;
    sv.onclick = async () => {
      const f = {}; S.fields.forEach(([k, , t]) => { const i = inp[k]; f[k] = t === "chk" ? i.checked : t === "num" ? (parseInt(i.value, 10) || 0) : i.value.trim(); });
      if (!(S.k === "pres" ? f.name : f.t)) return msg("ใส่ชื่อก่อนนะ", true);
      if (S.k === "yt") { f.yid = ytId(f.link); if (!f.yid && f.link) return msg("ลิงก์ YouTube ไม่ถูกต้อง", true); f.q = f.yid ? "" : f.t; }
      sv.disabled = true;
      const ok = editId ? await write({ op: "patch", id: editId, fields: f }, "แก้ไขแล้ว") : await write({ op: "add", post: Object.assign({ id: "n" + S.k + rid(8), sec: S.k, created: Date.now() }, f) }, "เพิ่มแล้ว");
      sv.disabled = false; if (ok) reset();
    };
    if (!rows.length) c.appendChild(el("p", "muted", "ยังไม่มีข้อมูล"));
    rows.forEach(p => {
      const it = el("div", "item"); it.appendChild(el("span", null, S.line(p)));
      const e = el("button", null, "แก้"), d = el("button", null, "ลบ"); e.type = d.type = "button";
      e.onclick = () => { editId = p.id; S.fields.forEach(([k, , t]) => { const i = inp[k]; if (t === "chk") i.checked = !!p[k]; else i.value = p[k] == null ? "" : p[k]; }); if (S.k === "yt" && !p.link && p.yid) inp.link.value = "https://youtu.be/" + p.yid; sv.textContent = "บันทึกการแก้ไข"; cancel.hidden = false; c.scrollIntoView({ behavior: "smooth" }); };
      d.onclick = async () => { if (confirm("ลบ \"" + S.line(p) + "\" ?")) await write({ op: "delete", id: p.id }, "ลบแล้ว"); };
      it.append(e, d); c.appendChild(it);
    });
    app.appendChild(c);
  });
}
function lock() { PIN = ""; try { localStorage.removeItem(PKEY); } catch (e) {} $("app").hidden = true; $("lockCard").hidden = false; }
async function unlock(p) {
  PIN = p; $("pinBtn").disabled = true; msg("กำลังโหลด…");
  try { await load(); try { localStorage.setItem(PKEY, p); } catch (e) {} $("lockCard").hidden = true; $("app").hidden = false; render(); msg("พร้อมแก้ไขแล้ว"); }
  catch (e) { msg("โหลดข้อมูลไม่ได้ เช็กอินเทอร์เน็ต", true); }
  $("pinBtn").disabled = false;
}
$("pinBtn").onclick = () => { const p = $("pin").value.trim(); if (p) unlock(p); };
$("pin").onkeydown = e => { if (e.key === "Enter") $("pinBtn").click(); };
try { const p = localStorage.getItem(PKEY); if (p) unlock(p); } catch (e) {}
</script>
